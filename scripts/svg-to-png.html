<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Favicon → PNG</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #F5F0E6;
      color: #2D2D2D;
    }
    .container { text-align: center; }
    canvas { border: 1px solid #D8CBB8; margin: 20px 0; border-radius: 8px; }
    button {
      background: #8B7355; color: white; border: none;
      padding: 12px 28px; border-radius: 6px; font-size: 16px;
      cursor: pointer; font-family: system-ui, sans-serif;
      margin: 4px 4px;
    }
    button:hover { opacity: 0.9; }
    #status { margin-top: 12px; font-size: 14px; color: #8B7355; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Haney Favicon → PNG</h2>
    <canvas id="canvas-512" width="512" height="512"></canvas>
    <canvas id="canvas-256" width="256" height="256" style="display:none;"></canvas>
    <br>
    <button id="download-512">Download PNG (512×512)</button>
    <button id="download-256">Download PNG (256×256)</button>
    <div id="status"></div>
  </div>

  <script>
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#F5F0E6"/>
  <defs>
    <path id="cat-head" d="M7 14 C7 6 9 3 12 2 L13 -2 L15 2 L17 -2 L19 2 C22 3 25 6 25 14 C25 22 21 30 16 30 C11 30 7 22 7 14Z"/>
    <clipPath id="cat-clip">
      <use href="#cat-head"/>
    </clipPath>
  </defs>
  <use href="#cat-head" fill="#FDFBF7"/>
  <g clip-path="url(#cat-clip)">
    <path d="M7 10 L16 -5 L16 32 L7 25Z" fill="#E8913A"/>
    <path d="M25 12 L21 -4 L16 0 L16 30 L25 26Z" fill="#2D2D2D"/>
    <circle cx="22" cy="24" r="7" fill="#E8913A"/>
  </g>
  <use href="#cat-head" fill="none" stroke="#2D2D2D" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="11.5" cy="16" r="1.8" fill="none" stroke="#2D2D2D" stroke-width="1.5"/>
  <circle cx="20.5" cy="16" r="1.8" fill="none" stroke="#2D2D2D" stroke-width="1.5"/>
  <path d="M14 20 L16 22 L18 20Z" fill="none" stroke="#2D2D2D" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M12.5 23.5 Q16 27 19.5 23.5" fill="none" stroke="#2D2D2D" stroke-width="1.5" stroke-linecap="round"/>
</svg>`;

    const status = document.getElementById('status');

    function render(id, size) {
      const canvas = document.getElementById(id);
      const ctx = canvas.getContext('2d');
      const img = new Image();
      const blob = new Blob([svg], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      img.onload = () => {
        ctx.clearRect(0, 0, size, size);
        ctx.drawImage(img, 0, 0, size, size);
        URL.revokeObjectURL(url);
      };
      img.src = url;
    }

    function download(id, filename) {
      const canvas = document.getElementById(id);
      canvas.toBlob((blob) => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        a.click();
        URL.revokeObjectURL(a.href);
        status.textContent = '✓ Downloaded!';
      }, 'image/png');
    }

    render('canvas-512', 512);
    render('canvas-256', 256);
    status.textContent = 'Ready — click a Download button to save';

    document.getElementById('download-512').addEventListener('click', () => download('canvas-512', 'haney-512.png'));
    document.getElementById('download-256').addEventListener('click', () => download('canvas-256', 'haney-256.png'));
  </script>
</body>
</html>
